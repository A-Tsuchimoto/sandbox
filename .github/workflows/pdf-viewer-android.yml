name: pdf-viewer-android

on:
  push:
    branches: [main]
    paths:
      - "pdf-viewer-android/**"
      - ".github/workflows/pdf-viewer-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-viewer-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-viewer-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk markpdf-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: markpdf-debug
          path: pdf-viewer-android/markpdf-debug.apk

      # スマホのブラウザから直接ダウンロードできるよう、常に最新版を 1 つの Release に置く
      - name: Publish to "pdf-viewer-debug" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pdf-viewer-debug --cleanup-tag --yes || true
          gh release create pdf-viewer-debug markpdf-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MarkPDF 試作版（最新ビルド）" \
            --notes "コミット ${GITHUB_SHA::7} からの自動ビルド（デバッグ版）。markpdf-debug.apk をダウンロードしてインストールしてください。"

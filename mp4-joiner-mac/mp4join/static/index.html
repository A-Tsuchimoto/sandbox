<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MP4 Joiner</title>
<style>
  :root {
    --bg: #f5f5f7; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7;
    --accent: #0071e3; --accent-text: #fff; --danger: #d70015; --chip: #e8f0fe; --chip-off: #ececf0;
    --drop: #cfe3ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --panel: #2c2c2e; --text: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c;
      --accent: #0a84ff; --chip: #1e3a5f; --chip-off: #3a3a3c; --danger: #ff453a; --drop: #1e3a5f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; padding: 9px 22px; }
  button.danger { color: var(--danger); }
  button.icon { padding: 2px 8px; }
  input[type=text], select, textarea { font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  textarea { width: 100%; min-height: 70px; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  .muted { color: var(--muted); }
  .error { color: var(--danger); white-space: pre-wrap; }

  #list { list-style: none; margin: 0; padding: 0; }
  .clip { display: grid; grid-template-columns: 26px 34px 120px 1fr auto; gap: 10px; align-items: center;
    padding: 6px 8px; border-radius: 8px; background: var(--bg); border: 1px solid transparent; }
  .clip.dragging { opacity: .4; }
  .clip.drop-before { box-shadow: 0 -3px 0 var(--accent); }
  .clip.drop-after { box-shadow: 0 3px 0 var(--accent); }
  .handle { cursor: grab; color: var(--muted); text-align: center; user-select: none; font-size: 18px; }
  .num { font-weight: 600; text-align: right; color: var(--muted); }
  .thumb { width: 120px; height: 68px; object-fit: cover; border-radius: 6px; background: #000; display: block; }
  .meta { min-width: 0; }
  .meta .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .info { color: var(--muted); font-size: 12px; }
  .meta .warn { color: #b25000; font-size: 12px; }
  .ops { display: flex; gap: 4px; }
  .gap { display: flex; justify-content: center; height: 26px; align-items: center; }
  .chip { border-radius: 999px; padding: 1px 12px; font-size: 12px; background: var(--chip); border-color: transparent; }
  .chip.off { background: var(--chip-off); color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }

  .opts { display: grid; grid-template-columns: max-content 1fr; gap: 10px 16px; align-items: center; }
  .opts > .k { color: var(--muted); }
  #output { flex: 1; min-width: 200px; }
  progress { width: 100%; height: 14px; }
  .summary { font-size: 13px; }
  @media (max-width: 640px) {
    .clip { grid-template-columns: 22px 28px 80px 1fr; }
    .clip .ops { grid-column: 3 / -1; justify-content: flex-end; }
    .thumb { width: 80px; height: 45px; }
    .opts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>MP4 Joiner</h1>
  <p class="sub">動画を並べて、1 本の MP4 にまとめます。ドラッグか ↑↓ で順番を入れ替えられます。</p>

  <section class="panel">
    <div class="row">
      <button id="addFiles">＋ ファイルを追加</button>
      <button id="addFolder">＋ フォルダから追加</button>
      <button id="togglePaths">パスを入力</button>
      <span class="spacer"></span>
      <span class="muted">並べ替え:</span>
      <button data-sort="gopro" title="GoPro のファイル番号 → 分割番号の順">GoPro 順</button>
      <button data-sort="date">撮影日時順</button>
      <button data-sort="name">名前順</button>
      <button data-sort="reverse">逆順</button>
      <button id="clear" class="danger">全部外す</button>
    </div>
    <div id="pathBox" hidden style="margin-top:10px">
      <textarea id="pathInput" placeholder="/Volumes/GoPro/DCIM/100GOPRO/GX010123.MP4&#10;フォルダを指定すると中の動画をまとめて追加します（1 行に 1 つ。Finder からドラッグ＆ドロップで貼り付けもできます）"></textarea>
      <div class="row" style="margin-top:6px"><button id="addPaths">追加</button></div>
    </div>
    <div id="loadMsg" class="muted" style="margin-top:8px"></div>
  </section>

  <section class="panel">
    <div class="row" style="margin-bottom:8px">
      <strong id="countLabel">0 本</strong><span class="muted" id="durLabel"></span>
    </div>
    <ol id="list"></ol>
    <div id="empty" class="empty">まだ動画がありません。「ファイルを追加」または「フォルダから追加」から選んでください。</div>
  </section>

  <section class="panel opts">
    <span class="k">フェード</span>
    <div class="row">
      <label><input type="checkbox" id="fadeOn"> つなぎ目をフェードアウト → フェードイン</label>
      <label><input type="range" id="fadeSec" min="0.5" max="5" step="0.5" value="1.5"> <span id="fadeSecLabel">1.5 秒</span></label>
    </div>
    <span class="k"></span>
    <div class="row fade-only">
      <label><input type="checkbox" id="keepChapters" checked> GoPro が自動分割した同じ撮影のつなぎ目はフェードしない</label>
      <label><input type="checkbox" id="fadeEdges"> 動画の最初と最後もフェード</label>
    </div>
    <span class="k">画質</span>
    <div class="row">
      <select id="codec">
        <option value="h264">H.264（互換性重視）</option>
        <option value="hevc">HEVC / H.265（ファイルが小さい）</option>
      </select>
      <select id="quality">
        <option value="high">高画質</option>
        <option value="standard" selected>標準</option>
        <option value="small">軽量</option>
      </select>
      <span class="muted">※ 再エンコード時のみ使います</span>
    </div>
    <span class="k">保存先</span>
    <div class="row">
      <input type="text" id="output" placeholder="~/Movies/旅行.mp4">
      <button id="pickOutput">選ぶ…</button>
    </div>
  </section>

  <section class="panel">
    <div id="planBox" class="summary muted">動画を追加すると、連結方法と予想サイズを表示します。</div>
    <div class="row" style="margin-top:12px">
      <button id="start" class="primary" disabled>連結する</button>
      <button id="cancel" hidden>キャンセル</button>
      <button id="reveal" hidden>Finder で表示</button>
      <span class="spacer"></span>
    </div>
    <div id="progressBox" hidden style="margin-top:12px">
      <progress id="bar" max="1" value="0"></progress>
      <div class="row"><span id="progMsg"></span><span class="spacer"></span><span id="progPct" class="muted"></span></div>
    </div>
    <div id="err" class="error"></div>
  </section>
</main>

<script>
const TOKEN = "__TOKEN__";
const IS_MAC = __IS_MAC__;
const $ = (id) => document.getElementById(id);

let clips = [];             // 現在の並び（probe 結果の配列）
const overrides = {};       // "前のpath|次のpath" -> true/false（つなぎ目ごとの手動指定）

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json", "X-Token": TOKEN },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function fmtTime(sec) {
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
function fmtSize(b) {
  return b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : (b / 1e6).toFixed(0) + " MB";
}

// --- GoPro の分割判定（core.py と同じ規則）---
function goproId(name) {
  let m = /^GOPR(\d{4})\./i.exec(name);
  if (m) return [+m[1], 0];
  m = /^G[HXPL](\d{2})(\d{4})\./i.exec(name);
  if (m) return [+m[2], +m[1]];
  return null;
}
function sameRecording(a, b) {
  const x = goproId(a), y = goproId(b);
  return !!(x && y && x[0] === y[0] && y[1] === x[1] + 1);
}
function naturalKey(s) {
  return s.split(/(\d+)/).map((t) => (/^\d+$/.test(t) ? t.padStart(12, "0") : t.toLowerCase())).join("");
}
function goproKey(name) {
  const id = goproId(name);
  return id ? "0" + String(id[0]).padStart(6, "0") + String(id[1]).padStart(3, "0") : "1" + naturalKey(name);
}

function transitionAt(i) {  // clips[i] と clips[i+1] の間をフェードするか
  const a = clips[i], b = clips[i + 1];
  const key = a.path + "|" + b.path;
  if (key in overrides) return overrides[key];
  return !($("keepChapters").checked && sameRecording(a.name, b.name));
}
function transitions() {
  return clips.slice(0, -1).map((_, i) => transitionAt(i));
}

// --- 追加 ---
function addClips(res) {
  const have = new Set(clips.map((c) => c.path));
  let added = 0;
  for (const c of res.clips || []) {
    if (!have.has(c.path)) { clips.push(c); have.add(c.path); added++; }
  }
  const msgs = [];
  if (added) msgs.push(`${added} 本追加しました。`);
  if ((res.clips || []).length > added) msgs.push(`${res.clips.length - added} 本は追加済みのためスキップ。`);
  $("loadMsg").innerHTML = "";
  $("loadMsg").textContent = msgs.join(" ");
  if (res.errors && res.errors.length) {
    const e = document.createElement("div");
    e.className = "error";
    e.textContent = res.errors.join("\n");
    $("loadMsg").appendChild(e);
  }
  if (!$("output").value && clips.length) {
    const dir = clips[0].path.replace(/[^/]+$/, "");
    $("output").value = dir + "joined.mp4";
  }
  render();
}
async function withLoading(fn) {
  $("loadMsg").textContent = "読み込み中…";
  try { addClips(await fn()); } catch (e) { $("loadMsg").textContent = ""; showError(e.message); }
}
$("addFiles").onclick = () => withLoading(() => api("/api/pick-files", {}));
$("addFolder").onclick = () => withLoading(() => api("/api/pick-folder", {}));
$("togglePaths").onclick = () => { $("pathBox").hidden = !$("pathBox").hidden; };
$("addPaths").onclick = () => {
  const paths = $("pathInput").value.split("\n").map((s) => s.trim().replace(/^'(.*)'$/, "$1").replace(/\\ /g, " ")).filter(Boolean);
  if (!paths.length) return;
  withLoading(() => api("/api/add", { paths })).then(() => { $("pathInput").value = ""; });
};
if (!IS_MAC) {  // Mac 以外ではダイアログが使えないのでパス入力を出しておく
  $("addFiles").disabled = $("addFolder").disabled = $("pickOutput").disabled = true;
  $("pathBox").hidden = false;
}

// --- 並べ替え ---
document.querySelectorAll("[data-sort]").forEach((b) => {
  b.onclick = () => {
    const how = b.dataset.sort;
    if (how === "reverse") clips.reverse();
    else if (how === "name") clips.sort((a, b) => naturalKey(a.name).localeCompare(naturalKey(b.name)));
    else if (how === "gopro") clips.sort((a, b) => goproKey(a.name).localeCompare(goproKey(b.name)));
    else if (how === "date") clips.sort((a, b) =>
      (!a.creation_time - !b.creation_time) || a.creation_time.localeCompare(b.creation_time) ||
      goproKey(a.name).localeCompare(goproKey(b.name)));
    render();
  };
});
$("clear").onclick = () => { if (clips.length && confirm("リストを空にしますか？（元の動画は消えません）")) { clips = []; render(); } };

function move(from, to) {
  if (to < 0 || to >= clips.length || from === to) return;
  const [c] = clips.splice(from, 1);
  clips.splice(to, 0, c);
  render();
}

// --- 描画 ---
let dragFrom = null;
function render() {
  const list = $("list");
  list.innerHTML = "";
  const fadeOn = $("fadeOn").checked;
  const sizes = new Set(clips.map((c) => `${c.width}x${c.height}@${c.fps}`));
  clips.forEach((c, i) => {
    if (i > 0 && fadeOn) {
      const gap = document.createElement("li");
      gap.className = "gap";
      const on = transitionAt(i - 1);
      const chip = document.createElement("button");
      chip.className = "chip" + (on ? "" : " off");
      chip.textContent = on ? "フェード" : (sameRecording(clips[i - 1].name, c.name) ? "そのまま（同じ撮影の続き）" : "そのまま");
      chip.title = "クリックで切り替え";
      chip.onclick = () => { overrides[clips[i - 1].path + "|" + c.path] = !on; render(); };
      gap.appendChild(chip);
      list.appendChild(gap);
    }
    const li = document.createElement("li");
    li.className = "clip";
    li.draggable = true;
    li.dataset.index = i;
    const thumbSrc = `/api/thumb?token=${encodeURIComponent(TOKEN)}&path=${encodeURIComponent(c.path)}`;
    li.innerHTML = `
      <div class="handle" title="ドラッグで移動">⋮⋮</div>
      <div class="num">${i + 1}</div>
      <img class="thumb" loading="lazy" alt="">
      <div class="meta">
        <div class="name"></div>
        <div class="info"></div>
        ${sizes.size > 1 ? '<div class="warn"></div>' : ""}
      </div>
      <div class="ops">
        <button class="icon" data-act="up" title="上へ">↑</button>
        <button class="icon" data-act="down" title="下へ">↓</button>
        <button class="icon danger" data-act="rm" title="リストから外す">✕</button>
      </div>`;
    li.querySelector(".thumb").src = thumbSrc;
    li.querySelector(".name").textContent = c.name;
    li.querySelector(".name").title = c.path;
    const date = c.creation_time ? c.creation_time.replace("T", " ").replace(/\.\d+Z?$|Z$/, "") : "";
    li.querySelector(".info").textContent =
      `${fmtTime(c.duration)} · ${c.width}×${c.height} · ${c.fps_value}fps · ${c.vcodec.toUpperCase()} · ${fmtSize(c.size)}` +
      (c.has_audio ? "" : " · 音声なし") + (date ? ` · ${date}` : "");
    if (sizes.size > 1) li.querySelector(".warn").textContent = "形式が他と異なる場合は揃えて再エンコードします";
    li.querySelector('[data-act="up"]').disabled = i === 0;
    li.querySelector('[data-act="down"]').disabled = i === clips.length - 1;
    li.querySelector('[data-act="up"]').onclick = () => move(i, i - 1);
    li.querySelector('[data-act="down"]').onclick = () => move(i, i + 1);
    li.querySelector('[data-act="rm"]').onclick = () => { clips.splice(i, 1); render(); };

    li.addEventListener("dragstart", (e) => { dragFrom = i; li.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
    li.addEventListener("dragend", () => { dragFrom = null; li.classList.remove("dragging"); clearDrop(); });
    li.addEventListener("dragover", (e) => {
      if (dragFrom === null) return;
      e.preventDefault();
      clearDrop();
      const r = li.getBoundingClientRect();
      li.classList.add(e.clientY < r.top + r.height / 2 ? "drop-before" : "drop-after");
    });
    li.addEventListener("drop", (e) => {
      if (dragFrom === null) return;
      e.preventDefault();
      const r = li.getBoundingClientRect();
      let to = i + (e.clientY < r.top + r.height / 2 ? 0 : 1);
      if (dragFrom < to) to--;
      const from = dragFrom;
      dragFrom = null;
      move(from, to);
    });
    list.appendChild(li);
  });
  $("empty").hidden = clips.length > 0;
  $("countLabel").textContent = `${clips.length} 本`;
  $("durLabel").textContent = clips.length ? `合計 ${fmtTime(clips.reduce((s, c) => s + c.duration, 0))}` : "";
  document.querySelectorAll(".fade-only input").forEach((el) => (el.disabled = !fadeOn));
  $("fadeSec").disabled = !fadeOn;
  updatePlan();
}
function clearDrop() {
  document.querySelectorAll(".drop-before,.drop-after").forEach((el) => el.classList.remove("drop-before", "drop-after"));
}

// --- オプション ---
function options() {
  return {
    clips: clips.map((c) => c.path),
    fade: $("fadeOn").checked ? +$("fadeSec").value : 0,
    transitions: transitions(),
    fade_edges: $("fadeEdges").checked,
    codec: $("codec").value,
    quality: $("quality").value,
  };
}
$("fadeSec").oninput = () => { $("fadeSecLabel").textContent = `${$("fadeSec").value} 秒`; updatePlan(); };
["fadeOn", "keepChapters"].forEach((id) => ($(id).onchange = render));
["fadeEdges", "codec", "quality"].forEach((id) => ($(id).onchange = updatePlan));
$("output").oninput = updateButtons;

let planTimer = null;
function updatePlan() {
  updateButtons();
  clearTimeout(planTimer);
  if (!clips.length) { $("planBox").textContent = "動画を追加すると、連結方法と予想サイズを表示します。"; return; }
  planTimer = setTimeout(async () => {
    try {
      const { plan } = await api("/api/plan", options());
      if (!plan) return;
      const mode = plan.mode === "copy" ? "⚡ 高速コピー（画質劣化なし）" : "🎞 再エンコード";
      $("planBox").textContent =
        `${mode} — ${plan.reason}  出力: ${plan.width}×${plan.height} / 長さ ${fmtTime(plan.total_duration)} / 予想サイズ 約 ${fmtSize(plan.estimated_bytes)}`;
    } catch (e) { $("planBox").textContent = e.message; }
  }, 200);
}

$("pickOutput").onclick = async () => {
  try {
    const cur = $("output").value.split("/").pop() || "joined.mp4";
    const { path } = await api("/api/pick-output", { default_name: cur });
    if (path) { $("output").value = path; updateButtons(); }
  } catch (e) { showError(e.message); }
};

// --- 実行 ---
let running = false;
function updateButtons() {
  $("start").disabled = running || clips.length < 1 || !$("output").value.trim();
}
function showError(msg) { $("err").textContent = msg || ""; }

$("start").onclick = async () => {
  showError("");
  $("reveal").hidden = true;
  const body = { ...options(), output: $("output").value.trim() };
  try {
    await api("/api/start", body);
  } catch (e) {
    if (/同名のファイル/.test(e.message) && confirm(e.message + "\n上書きしますか？")) {
      try { await api("/api/start", { ...body, overwrite: true }); } catch (e2) { return showError(e2.message); }
    } else return showError(e.message);
  }
  setRunning(true);
  poll();
};
$("cancel").onclick = () => api("/api/cancel", {}).catch(() => {});
$("reveal").onclick = () => api("/api/reveal", { path: $("reveal").dataset.path }).catch(() => {});

function setRunning(on) {
  running = on;
  $("cancel").hidden = !on;
  $("progressBox").hidden = false;
  document.querySelectorAll("main button:not(#cancel):not(#reveal), main input, main select, main textarea")
    .forEach((el) => (el.disabled = on));
  if (!IS_MAC) $("addFiles").disabled = $("addFolder").disabled = $("pickOutput").disabled = true;
  if (!on) render();
  updateButtons();
}

async function poll() {
  let st;
  try { st = await api("/api/status"); } catch (e) { setTimeout(poll, 1000); return; }
  $("bar").value = st.progress || 0;
  $("progMsg").textContent = st.message || "";
  $("progPct").textContent = `${Math.floor((st.progress || 0) * 100)}%`;
  if (st.state === "running") { setTimeout(poll, 500); return; }
  setRunning(false);
  if (st.state === "done") {
    $("progMsg").textContent = "完了しました: " + st.output;
    if (IS_MAC) { $("reveal").hidden = false; $("reveal").dataset.path = st.output; }
  } else if (st.state === "error") {
    showError(st.error);
  }
}

render();
api("/api/status").then((st) => { if (st.state === "running") { setRunning(true); poll(); } }).catch(() => {});
</script>
</body>
</html>
